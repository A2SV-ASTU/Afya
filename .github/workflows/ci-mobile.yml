name: Mobile CI
on:
  pull_request:
    paths: ['mobile/**']
  push:
    branches: [main]
    paths: ['mobile/**']
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env stub for CI
        run: cp .env.example .env

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
