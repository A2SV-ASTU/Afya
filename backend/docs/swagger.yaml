      parameters:
      - description: Invitation Token
        in: path
        name: token
        required: true
        type: string
      - description: Sign up details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/src_invitations.AcceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Doctor account created
          schema:
            $ref: '#/definitions/afyamind-backend_src_users.UserResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "409":
          description: Invitation already used or revoked
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "410":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      summary: Accept invitation & complete signup
      tags:
      - Invitations
  /magic/accept-invitation:
    get:
      description: Serves the HTML form page for an invited doctor to complete registration.
      parameters:
      - description: Secure token from the invitation email
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Returns the doctor registration HTML page
          schema:
            type: string
        "400":
          description: Returns an HTML error page indicating missing token
          schema:
            type: string
      summary: View accept invitation page
      tags:
      - MagicLinks
  /magic/access-request:
    get:
      description: Serves the HTML confirmation page for a patient to approve or deny
        a clinical records access request.
      parameters:
      - description: Secure token sent in the request email
        in: query
        name: token
        required: true
        type: string
      - description: 'Action to perform: ''approve'' or ''deny'''
        in: query
        name: action
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Returns the HTML approval/denial confirmation page
          schema:
            type: string
        "400":
          description: Returns an HTML error page indicating bad request parameters
          schema:
            type: string
      summary: View access request page
      tags:
      - MagicLinks
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Processes the HTML form submission to approve or deny the access
        request.
      parameters:
      - description: Secure token
        in: formData
        name: token
        required: true
        type: string
      - description: 'Action to confirm: ''approve'' or ''deny'''
        in: formData
        name: action
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Returns an HTML success or error page indicating the result
            of the action
          schema:
            type: string
        "400":
          description: Returns an HTML error page indicating missing form data
          schema:
            type: string
      summary: Confirm access request action
      tags:
      - MagicLinks
  /magic/reset-password:
    get:
      description: Serves the HTML form page for a user to reset their password.
      parameters:
      - description: Secure token from the email link
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Returns the password reset HTML form
          schema:
            type: string
        "400":
          description: Returns an HTML error page indicating missing query parameters
          schema:
            type: string
      summary: View password reset form page
      tags:
      - MagicLinks
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Processes the HTML form submission to securely reset the user's
        password.
      parameters:
      - description: Secure token
        in: formData
        name: token
        required: true
        type: string
      - description: New password (min 8 characters)
        in: formData
        name: password
        required: true
        type: string
      - description: Must match the new password
        in: formData
        name: confirm_password
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Returns an HTML success or error page indicating the result
            of the reset
          schema:
            type: string
        "400":
          description: Returns an HTML error page indicating missing form data
          schema:
            type: string
      summary: Confirm password reset
      tags:
      - MagicLinks
  /patient/access-requests/active:
    get:
      description: Returns pending (non-expired) access requests directed at the patient.
      produces:
      - application/json
      responses:
        "200":
          description: Pending access requests
          schema:
            allOf:
            - $ref: '#/definitions/afyamind-backend_src_shared_response.DataEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/src_access-requests.AccessRequest'
                  type: array
              type: object
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List pending access requests for the authenticated patient
      tags:
      - AccessRequests
  /patient/grants:
    get:
      description: Returns approved, non-revoked access requests (grants) for the
        patient.
      produces:
      - application/json
      responses:
        "200":
          description: Active grants
          schema:
            allOf:
            - $ref: '#/definitions/afyamind-backend_src_shared_response.DataEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/src_access-requests.AccessRequest'
                  type: array
              type: object
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List active grants for the authenticated patient
      tags:
      - AccessRequests
  /patient/grants/{clinicId}/revoke:
    post:
      description: Patient revokes a previously approved access request from a clinic.
      parameters:
      - description: Clinic ID
        in: path
        name: clinicId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Grant revoked
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.MessageEnvelope'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "404":
          description: No active grant found
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Revoke a clinic grant (patient-initiated)
      tags:
      - AccessRequests
  /patients/{patientId}/appointments:
    get:
      description: Retrieves all scheduled/past appointments for a specific patient.
        Filterable by status.
      parameters:
      - description: Patient UUID
        in: path
        name: patientId
        required: true
        type: string
      - description: Filter by appointment status (scheduled, attended, cancelled)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of appointments
          schema:
            allOf:
            - $ref: '#/definitions/afyamind-backend_src_shared_response.DataEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/src_appointments.Appointment'
                  type: array
              type: object
        "400":
          description: Validation/ID error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get appointments for a patient
      tags:
      - Appointments
  /patients/{patientId}/encounters:
    get:
      description: Retrieves all encounters recorded for a specific patient. Supports
        pagination.
      parameters:
      - description: Patient ID
        in: path
        name: patientId
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of encounters
          schema:
            properties:
              encounters:
                items:
                  $ref: '#/definitions/src_encounters.Encounter'
                type: array
              limit:
                type: integer
              page:
                type: integer
              total:
                type: integer
            type: object
        "400":
          description: Invalid Patient ID
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List encounters for a patient
      tags:
      - Encounters
    post:
      description: Opens a clinical encounter session for a patient. Enforces doctor
        access.
      parameters:
      - description: Patient UUID
        in: path
        name: patientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Encounter created successfully
          schema:
            $ref: '#/definitions/src_encounters.EncounterResponse'
        "400":
          description: Invalid Patient ID
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Open a new clinical encounter
      tags:
      - Encounters
  /patients/{patientId}/prescriptions:
    get:
      description: Returns all prescriptions across all encounters for a given patient.
        Supports pagination. Patient (self) or doctor with active access grant only.
      parameters:
      - description: Patient ID
        in: path
        name: patientId
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of prescriptions
          schema:
            properties:
              limit:
                type: integer
              page:
                type: integer
              prescriptions:
                items:
                  $ref: '#/definitions/src_prescriptions.PrescriptionResponse'
                type: array
              total:
                type: integer
            type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "403":
          description: Forbidden / Access denied
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List all prescriptions for a patient
      tags:
      - Prescriptions
  /patients/{patientId}/vitals:
    get:
      description: Lists vital signs history for a patient. Patient or Doctor with
        active access grant only.
      parameters:
      - description: Patient ID
        in: path
        name: patientId
        required: true
        type: string
      - description: Filter start time (RFC3339 format)
        in: query
        name: from
        type: string
      - description: Filter end time (RFC3339 format)
        in: query
        name: to
        type: string
      - description: Filter by source (clinic or patient)
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of vital signs
          schema:
            items:
              $ref: '#/definitions/src_vitals.VitalSign'
            type: array
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "403":
          description: Forbidden / No access grant
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List patient vitals
      tags:
      - Vitals
  /patients/lookup:
    get:
      description: Looks up a patient by their exact email. Accessible by clinic admins.
      parameters:
      - description: Patient Email Address
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Patient found
          schema:
            $ref: '#/definitions/src_access-requests.PatientLookupResponse'
        "400":
          description: Missing email query parameter
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "404":
          description: Patient not found
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Lookup a patient by email
      tags:
      - AccessRequests
  /patients/me/vitals/doctor-sync:
    get:
      description: Fetches clinic-recorded vitals since a specific timestamp to sync
        back to patient's app. Patient only.
      parameters:
      - description: Fetch records since this timestamp (RFC3339 format)
        in: query
        name: since
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of clinical vital signs to sync
          schema:
            items:
              $ref: '#/definitions/src_vitals.VitalSign'
            type: array
        "400":
          description: Validation / parsing error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get clinic-recorded vitals for sync
      tags:
      - Vitals
  /patients/me/vitals/doctor-sync/ack:
    post:
      consumes:
      - application/json
      description: Acknowledges that clinic-recorded vitals have been successfully
        synced to the patient's device. Patient only.
      parameters:
      - description: List of vital IDs successfully synced
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/src_vitals.AckVitalsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Count of acknowledged records under key 'acked'
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Acknowledge synced clinic vitals
      tags:
      - Vitals
  /patients/me/vitals/sync:
    post:
      consumes:
      - application/json
      description: Syncs offline logged patient vitals with deduplication support.
        Patient only.
      parameters:
      - description: Offline vitals entries
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/src_vitals.SyncVitalsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sync results with status
          schema:
            $ref: '#/definitions/src_vitals.SyncVitalsResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Sync offline patient vitals
      tags:
      - Vitals
  /prescriptions/{id}:
    patch:
      consumes:
      - application/json
      description: Updates notes or items of an active prescription. Enforces doctor
        access.
      parameters:
      - description: Prescription ID
        in: path
        name: id
        required: true
        type: string
      - description: Prescription update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/src_prescriptions.UpdatePrescriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Prescription updated successfully
          schema:
            $ref: '#/definitions/src_prescriptions.PrescriptionResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "403":
          description: Forbidden / Access denied
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a prescription
      tags:
      - Prescriptions
  /prescriptions/{id}/complete:
    patch:
      consumes:
      - application/json
      description: Marks specific items in a prescription as completed. Enforces patient
        access.
      parameters:
      - description: Prescription ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional list of item IDs to mark completed (if empty, marks
          all)
        in: body
        name: body
        schema:
          $ref: '#/definitions/src_prescriptions.CompletePrescriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns status 'completed' on success
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "403":
          description: Forbidden / Access denied
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Complete prescription items
      tags:
      - Prescriptions
  /prescriptions/{id}/deactivate:
    patch:
      description: Deactivates all active items within a prescription. Enforces doctor
        access.
      parameters:
      - description: Prescription ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns status 'deactivated' on success
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "403":
          description: Forbidden / Access denied
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Deactivate active prescription items
      tags:
      - Prescriptions
  /users/me:
    delete:
      description: Permanently deletes the authenticated user's account (not allowed
        for super_admin role).
      produces:
      - application/json
      responses:
        "200":
          description: Account deleted
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.MessageEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "403":
          description: Forbidden for super_admin role
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete current user account
      tags:
      - Users
    get:
      description: Returns the full profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            allOf:
            - $ref: '#/definitions/afyamind-backend_src_shared_response.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/src_users.UserResponse'
              type: object
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Partially updates the authenticated user's profile. All fields
        are optional.
      parameters:
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/src_users.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated profile
          schema:
            allOf:
            - $ref: '#/definitions/afyamind-backend_src_shared_response.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/src_users.UserResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Users
  /users/me/password:
    put:
      consumes:
      - application/json
      description: |-
        Updates the authenticated user's password after verifying the current one.
        Accessible via both PUT and PATCH on /users/me/password.
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/src_users.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.MessageEnvelope'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated or wrong current password
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change account password
      tags:
      - Users
  /vitals:
    post:
      consumes:
      - application/json
      description: Logs patient vital signs as a self-entry. Enforces patient access.
      parameters:
      - description: Vital signs details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/src_vitals.LogPatientVitalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Vital signs logged successfully
          schema:
            $ref: '#/definitions/src_vitals.VitalSign'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/afyamind-backend_src_shared_response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Log patient vital signs self-entry
      tags:
      - Vitals
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'JWT access token. Format: **Bearer &lt;token&gt;**'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
