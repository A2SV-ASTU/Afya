name: afyamind_mobile
description: "AfyaMind Patient Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  injectable: ^2.4.4
  equatable: ^2.0.5

  # Functional Error Handling
  fpdart: ^1.1.0

  # Routing
  go_router: ^14.2.0

  # Networking & Cookie Storage
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^9.2.2

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local Notifications & UUID
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  uuid: ^4.4.0
  intl: ^0.19.0
  mobile: ^1.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  injectable_generator: ^2.6.2
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
